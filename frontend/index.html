<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/PachamapaSans-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#9a3412" />
    <meta name="description" content="Clima y estado de la ruta por tramo en Jujuy: Quebrada de Humahuaca, Cuesta de Lipán y Salinas Grandes." />
    <script>
      // Aplica el tema antes de pintar, para que no parpadee.
      try {
        var t = localStorage.getItem('pm-tema')
        if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        document.documentElement.dataset.tema = t
      } catch (e) {}
    </script>
    <title>Pachamapa · Clima y ruta en Jujuy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
