# Postgres local para desarrollo. En produccion se usa Neon.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pachamapa
      POSTGRES_PASSWORD: pachamapa
      POSTGRES_DB: pachamapa
    ports:
      - "5433:5432"
    volumes:
      - pachamapa_db:/var/lib/postgresql/data
volumes:
  pachamapa_db:
